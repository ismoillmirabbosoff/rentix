# Haqiqiy domenlarsiz ham stackni sinash imkonini beradi: Caddy Let's Encrypt
# o'rniga o'z-o'ziga imzolangan sertifikat ishlatadi.
#
#   COMPOSE_FILE="docker-compose.yml:docker-compose.test.yml" ./deploy.sh install
